<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2DO</title>

    <style>
        /* couleurs */
        :root {
            --dark-green: #2f4f4f;
            --light-green: #04bd8e; 
            --pink: #ff66b2; 
            --light-pink: #ff99cc; 
            --white: #ffffff;
            --light-gray: #f4f4f4;
            --gray: #ccc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--dark-green);
            color: var(--dark-green);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            color: var(--dark-green);
            font-size: 36px;
            margin-top: 20px;
        }

        h2 {
            color: var(--pink);
            font-size: 24px;
            margin-top: 20px;
        }

        h3 {
            color: var(--dark-green);
            font-size: 20px;
            margin-top: 20px;
        }

        img {
            margin-top: 10px;
            border-radius: 10px;
        }

        /* formulaire de noivelle tache */
        form {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        textarea {
            padding: 10px;
            margin: 5px;
            border: 1px solid var(--gray);
            border-radius: 5px;
            width: 300px;
            max-width: 100%;
            resize: none;
        }
        /*bouton sauvegarder*/
        input[type="submit"] {
            background-color: var(--light-green);
            color: var(--white);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: var(--pink);
        }

        /* Liste des tâches */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: var(--white);
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Contenu de la tâche */
        .task-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        .task-content strong {
            font-size: 18px;
            color: var(--dark-green);
        }

        .task-content span {
            font-size: 14px;
            color: var(--gray);
        }

        /* les boutons */
        .button-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-button {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .action-button:hover {
            transform: scale(1.2);
        }

        /* formulaire d'édition */
        .edit-form input {
            padding: 10px;
            margin: 5px;
            border: 1px solid var(--gray);
            border-radius: 5px;
            width: 250px;
        }

        .edit-form button {
            background-color: var(--pink);
            color: var(--white);
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-form button:hover {
            background-color: var(--dark-green);
        }

        /* Tâches complètes */
        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Animation hover sur l'input checkbox */
        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }
        /*c'est moche*/
    </style>
</head>

<body>
    <h1>2do list</h1>
    <img src="{{ url_for('static', filename='media/logo2do.png') }}" alt="Logo du site" width="200" height="100" />

    <h2>Ajouter un 2do ?</h2>
    <form action="/submit" method="post">
        <label for="userText">Ajouter une tâche :</label><br>
        <textarea id="newTask" name="newTask" placeholder="Tâche" rows="1" cols="50"></textarea>
        <textarea id="descTask" name="descTask" placeholder="Description" rows="1" cols="50"></textarea>
        <br>
        <input type="submit" value="Ajouter">
    </form>

    <h3>Votre liste 2do :</h3>
    <ul>
    {% for task in tasks|reverse %}
        <li>
            <div class="task-content">
                <!-- Case à cocher pour la tâche -->
                <input type="checkbox" onclick="toggleCompleted(this)" />
                <strong>{{ task[1] }}</strong>
                <span>{{ task[2] }}</span>
                <span>{{ task[3] }}</span>

                <!-- les boutons -->
                <div class="button-group">
                    <form action="/delete/{{ task[0] }}" method="post" style="display:inline;"><!--supprimer-->
                        <button class="action-button">
                            <img src="{{ url_for('static', filename='media/bin2do.png') }}" alt="Corbeille" width="50" height="25"/>
                        </button>
                    </form>
                    <button type="button" data-task-id="{{ task[0] }}" onclick="showEditForm(this)" class="action-button"><!--modifier-->
                        <img src="{{ url_for('static', filename='media/editpenfor2do.png') }}" alt="modifier tâche" width="50" height="25"/>
                    </button>
                </div>
            </div>

            <!-- formulaire d'édition -->
            <div id="edit-form-{{ task[0] }}" style="display:none;">
                <form action="/edit/{{ task[0] }}" method="post" class="edit-form">
                    <input type="text" name="title" value="{{ task[1] }}" required>
                    <input type="text" name="description" value="{{ task[2] }}">
                    <button type="submit">Enregistrer</button>
                    <button type="button" data-task-id="{{ task[0] }}" onclick="hideEditForm(this)">Annuler</button>
                </form>
            </div>
        </li>
    {% endfor %}
    </ul>

    <!-- Javascript -->
    <script>
        function showEditForm(button) { //faire apparaitre le formulaire d'édition quand bouton appuyé
            const taskId = button.dataset.taskId;
            document.getElementById('edit-form-' + taskId).style.display = 'block';
        }

        function hideEditForm(button) { //cacher le formulaire d'edition (par défaut)
            const taskId = button.dataset.taskId;
            document.getElementById('edit-form-' + taskId).style.display = 'none';
        }

        function toggleCompleted(checkbox) { //barrer quand case cochée
            const taskContent = checkbox.parentElement;
            taskContent.classList.toggle("completed", checkbox.checked);
        }
    </script>

</body>
</html>
